# nginx do File Reader para acesso externo via tunel da Cloudflare.
# Caminhos relativos sao resolvidos a partir do prefixo infra/nginx (ver iniciar-tunel.ps1).

worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;
    sendfile    on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mesmo limite de upload do backend (spring.servlet.multipart.max-file-size)
    client_max_body_size 25m;

    server {
        listen       127.0.0.1:8088;
        server_name  _;

        # Build de producao do Angular (npm run build)
        root   ../../frontend/dist/frontend/browser;
        index  index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Frontend e API ficam na mesma origem atras do nginx, entao nao ha CORS de verdade aqui.
            # Sem isto o Spring compara o Origin publico (https://...trycloudflare.com) com a lista de CORS
            # (so localhost:4200) e recusa POST/PUT/DELETE com 403.
            proxy_set_header Origin "";

            proxy_read_timeout 120s;
        }

        # Rotas do Angular (/servicos, /processar...) sao resolvidas no navegador
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
