# nginx do container do frontend. Mesmo papel do infra/nginx/conf/nginx.conf, mas apontando
# para o servico "backend" do docker-compose.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen       80;
    server_name  _;

    # Mesmo limite de upload do backend (spring.servlet.multipart.max-file-size)
    client_max_body_size 25m;

    root   /usr/share/nginx/html;
    index  index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Front e API ficam na mesma origem atras do nginx; sem isto o CORS do Spring
        # (so localhost:4200) recusaria POST/PUT/DELETE com 403.
        proxy_set_header Origin "";

        proxy_read_timeout 120s;
    }

    # Rotas do Angular (/servicos, /processar...) sao resolvidas no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
