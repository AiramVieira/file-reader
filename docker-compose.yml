services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filereader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filereader"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/filereader
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  uploads:
