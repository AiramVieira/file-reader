spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/filereader}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

filereader:
  storage:
    upload-dir: ${FILEREADER_UPLOAD_DIR:./uploads}
  anchor:
    tokens-before: 3
    tokens-after: 3
    max-distance: 10
    match-threshold: 0.7

logging:
  level:
    com.filereader.backend: DEBUG
